# ---------------------------------------------------------------------------
# Edge Functions
#
# verify_jwt = false on EVERY function, and not as a shortcut.
#
# The platform's built-in verify_jwt only understands the legacy JWT-based anon
# and service_role keys. Those are disabled on this project in favour of the
# sb_publishable_ / sb_secret_ format (amendment K), which are opaque strings
# rather than JWTs — so the built-in check cannot validate them and rejects the
# request with "Invalid JWT". Supabase's own guidance is to use --no-verify-jwt
# whenever the new keys are in play.
#
# The consequence is deliberate and load-bearing: nothing has authenticated the
# caller before a handler runs, so every function proves identity itself via
# requireCaller() -> auth.getUser(). register and login have no caller to prove,
# which is why the auth_attempts throttling is the only thing in front of a PIN
# brute-force on those two.
#
# Keys must be sent on the `apikey` header ONLY. A publishable key placed on
# Authorization: Bearer is parsed as a JWT and rejected; requireCaller detects
# that specific mistake and names it, because the resulting error is otherwise
# baffling to debug.
# ---------------------------------------------------------------------------

[functions.register]
verify_jwt = false

[functions.login]
verify_jwt = false

[functions."change-pin"]
verify_jwt = false

[functions."initiate-debit"]
verify_jwt = false

[functions."confirm-debit"]
verify_jwt = false

# reset-pin is called from a LOGGED-OUT device — the caller cannot sign in, which
# is the entire situation. No session exists to verify, so the endpoint is public
# and is protected instead by the claim itself: short-lived, single-use, and
# created only by someone who vouched in person.
[functions."reset-pin"]
verify_jwt = false

# The operator's panel. Authenticated, but verify_jwt stays false for the same
# reason as everywhere else (amendment K). Identity is proven via requireCaller,
# and every action then calls a definer function that checks is_admin() in SQL —
# the gate is at the data, not at the screen.
[functions.admin]
verify_jwt = false

# The debt confirmation. verify_jwt = false like every other function
# (amendment K): the platform check only understands legacy JWT keys, and this
# project uses the sb_publishable_/sb_secret_ format. The session is validated
# in code by requireCaller(), and a PIN is demanded on top of it.
[functions."confirm-debt"]
verify_jwt = false
